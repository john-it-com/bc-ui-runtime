# Purpose: fix code style issues automatically

name: Fix PHP code style issues

on:
  push:
    branches: ['**']
    paths:
      - '**.php'
      - .github/workflows/**
  workflow_dispatch:

jobs:
  php-code-styling:
    timeout-minutes: 60
    if: >-
      ${{ github.ref_type != 'tag' }}
    # Use the organization's Docker-enabled Debian runner.
    runs-on: [self-hosted, linux, x64, debian-13, docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP 8.5 and Pint
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: pint
          coverage: none
          extensions: pdo_sqlite
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fix PHP code style issues
        run: pint
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Fix styling
    container: shivammathur/node:24.04
    defaults:
      run:
        shell: bash
