# Purpose: Publish the bc-ui-runtime npm package on version tags.
# Role: Automates public npm publishing whenever a new git tag is pushed.

name: Publish npm package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));const tag=process.env.GITHUB_REF_NAME||'';if(tag!==pkg.version){console.error(`Tag ${tag} does not match package.json version ${pkg.version}`);process.exit(1);}console.log(`Tag ${tag} matches package version ${pkg.version}`);"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance
