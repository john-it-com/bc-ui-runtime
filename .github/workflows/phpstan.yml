# Verify this package in isolation on PHP 8.5 with the latest compatible dependencies from composer.json.
name: PHPStan

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Replace older runs of this workflow on the same branch or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    timeout-minutes: 60
    name: PHPStan / PHP 8.5 / Laravel 13
    runs-on: [self-hosted, linux, x64, debian-13, docker]
    container: shivammathur/node:24.04
    defaults:
      run:
        shell: bash
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
      APP_ENV: testing
      COLUMNS: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, dom, fileinfo, intl, mbstring, pdo_mysql, xml
          coverage: none
          github-token: ${{ github.token }}
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve package-local dependencies
        run: >-
          composer update
          --prefer-stable --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - name: Discover development packages
        run: composer discover
      - name: Record resolved dependencies
        run: |
          mkdir -p build
          composer show --locked --format=json > build/dependencies.json
      - name: PHPStan
        run: vendor/bin/phpstan analyse --error-format=github
