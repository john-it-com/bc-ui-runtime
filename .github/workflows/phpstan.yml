# Purpose: Execute the package-local PHPStan analysis in CI for this module.

name: PHPStan

on:
  push:
    branches:
      - develop
      - master
    paths:
      - "**.php"
      - "phpstan.neon.dist"
  pull_request:
    branches:
      - develop
      - master
    paths:
      - "**.php"
      - "phpstan.neon.dist"

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github
