# Purpose: Execute the package-local PHPStan analysis in CI for this module.

name: PHPStan

on:
  push:
    branches:
      - develop
      - master
      - laravel-12-13
    paths:
      - '**.php'
      - phpstan.neon.dist
      - .github/workflows/phpstan.yml
      - .github/workflows/**
      - composer.json
      - composer.lock
    tags:
      - 3.*
      - v3.*
  pull_request:
    branches:
      - develop
      - master
      - laravel-12-13
    paths:
      - '**.php'
      - phpstan.neon.dist
      - .github/workflows/phpstan.yml
      - .github/workflows/**
      - composer.json
      - composer.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan
    # Keep PHP/Node tooling in Ubuntu containers on the organization's Debian runner.
    runs-on: [self-hosted, linux, x64, debian-13, docker]
    container: shivammathur/node:24.04
    defaults:
      run:
        shell: bash
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
      runner: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, sqlite, bcmath
          coverage: none
          github-token: ${{ github.token }}

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github
