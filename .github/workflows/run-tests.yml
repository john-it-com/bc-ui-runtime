# Verify the isolated bc-ui-runtime package on PHP 8.5 and Laravel 13.
name: run-tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Replace older runs of this workflow on the same branch or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    name: Backend tests / PHP 8.5 / Laravel 13
    runs-on: [self-hosted, linux, x64, debian-13, docker]
    container: shivammathur/node:24.04
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: testing
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: bc_ui_runtime_testing
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        shell: bash
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_DATABASE: bc_ui_runtime_testing
      DB_USERNAME: root
      DB_PASSWORD: testing
      DB_URL: ''
      DATABASE_URL: ''
      DB_SOCKET: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      BCRYPT_ROUNDS: '4'
      COLUMNS: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Refresh image package indexes so setup-php can resolve GD system dependencies.
      - name: Refresh runner package metadata
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 290s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, bcmath, dom, fileinfo, intl, mbstring, pdo_mysql, xml
          coverage: none
          github-token: ${{ github.token }}
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve package-local dependencies
        run: >-
          composer update
          --prefer-stable --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - name: Discover development packages
        run: composer discover
      - name: Publish config files
        run: vendor/bin/testbench vendor:publish --tag=config --no-interaction
      - name: Record resolved dependencies
        run: |
          mkdir -p build
          composer check-platform-reqs
          php --version > build/php-version.txt
          php --modules > build/php-extensions.txt
          composer show --locked --format=json > build/dependencies.json
      - name: Backend tests
        run: vendor/bin/testbench package:test --parallel --testsuite=Package --no-coverage
  build-assets:
    timeout-minutes: 60
    name: Module asset resolution
    runs-on: [self-hosted, linux, x64, debian-13, docker]
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install frontend dependencies
        run: npm ci
      - name: Check package version consistency
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[''].version, manifest.version);
          JS
      - name: Check frontend types
        run: npm run typecheck
      - name: Build runtime
        run: npm run build
      - name: Test module asset resolution
        run: npm run test:build
