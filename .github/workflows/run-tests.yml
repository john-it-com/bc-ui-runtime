# Verify the isolated bc-ui-runtime package on PHP 8.4 and Laravel 13.
name: run-tests

on:
  push:
    branches: [develop, master, laravel-12-13]
    tags: ['3.*', 'v3.*']
  pull_request:
    branches: [develop, master, laravel-12-13]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests / PHP 8.4 / Laravel 13 / ${{ matrix.resolution }}
    runs-on: [self-hosted, linux, x64, debian-13, docker]
    container: shivammathur/node:24.04
    defaults:
      run:
        shell: bash
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
      APP_ENV: testing
      COLUMNS: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: floor
            laravel: '13.40.0'
            testbench: '11.3.0'
          - resolution: latest
            laravel: '^13.40'
            testbench: '^11.3'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Refresh image package indexes so setup-php can resolve GD system dependencies.
      - name: Refresh runner package metadata
        run: apt-get update -qq
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, bcmath, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, xml
          coverage: none
          github-token: ${{ github.token }}
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve package-local dependencies
        run: >-
          composer update
          --with "laravel/framework:${{ matrix.laravel }}"
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --prefer-stable --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - name: Discover development packages
        run: composer discover
      - name: Publish config files
        run: vendor/bin/testbench vendor:publish --tag=config --no-interaction
      - name: Record resolved dependencies
        run: |
          mkdir -p build
          composer show --locked --format=json > build/dependencies.json
      - name: Backend tests
        run: composer test -- --no-coverage
      - name: Retain dependency and quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-${{ matrix.resolution }}-${{ github.sha }}
          path: |
            composer.lock
            build/dependencies.json


  production:
    name: Production install / PHP 8.4 / Laravel 13 / ${{ matrix.resolution }}
    runs-on: [self-hosted, linux, x64, debian-13, docker]
    container: shivammathur/node:24.04
    defaults:
      run:
        shell: bash
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
      APP_ENV: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: floor
            laravel: '13.40.0'
          - resolution: latest
            laravel: '^13.40'
    steps:
      - uses: actions/checkout@v4
      - name: Refresh runner package metadata
        run: apt-get update -qq
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, bcmath, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, xml
          coverage: none
          github-token: ${{ github.token }}
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve production dependencies without development tooling
        run: >-
          composer update --no-dev
          --with "laravel/framework:${{ matrix.laravel }}"
          --prefer-stable --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - name: Boot bc-ui-runtime services without Testbench
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/logs
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';

          if (class_exists(Orchestra\Testbench\TestCase::class)) {
              throw new RuntimeException('Testbench must not be installed in production.');
          }

          $app = Illuminate\Foundation\Application::configure(basePath: getcwd())
              ->withProviders([JohnIt\Bc\Runtime\PackageServiceProvider::class])
              ->create();
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          if ($app->getProvider(JohnIt\Bc\Runtime\PackageServiceProvider::class) === null) {
              throw new RuntimeException('The bc-ui-runtime provider did not boot.');
          }
          echo "bc-ui-runtime production services boot without Testbench.\n";
          PHP
      - name: Retain production dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ matrix.resolution }}-${{ github.sha }}
          path: composer.lock

  build-assets:
    name: Module asset resolution
    runs-on: [self-hosted, linux, x64, debian-13, docker]
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install frontend dependencies
        run: npm ci
      - name: Check package version consistency
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[''].version, manifest.version);
          JS
      - name: Check frontend types
        run: npm run typecheck
      - name: Build runtime
        run: npm run build
      - name: Test module asset resolution
        run: npm run test:build
