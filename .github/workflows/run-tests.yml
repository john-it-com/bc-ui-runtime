# Purpose: Verify runtime assets and the isolated PHP 8.4 / Laravel 12 backend at floor/latest resolutions.

name: run-tests

on:
  push:
    branches:
      - develop
      - master
      - laravel-12-13
    tags:
      - 3.*
      - v3.*
  pull_request:
    branches:
      - develop
      - master
      - laravel-12-13
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-assets:
    name: Module asset resolution
    runs-on: [self-hosted, linux, x64, debian-13, docker]
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install frontend dependencies
        run: npm ci
      - name: Check package version consistency
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[''].version, manifest.version);
          JS
      - name: Check frontend types
        run: npm run typecheck
      - name: Build runtime
        run: npm run build
      - name: Test module asset resolution
        run: npm run test:build


  test:
    name: Backend tests / PHP 8.4 / Laravel 12 / ${{ matrix.resolution }}
    runs-on: [self-hosted, linux, x64, debian-13, docker]
    container: shivammathur/node:24.04
    defaults:
      run:
        shell: bash
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
      APP_ENV: testing
      COLUMNS: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: floor
            laravel: '12.72.0'
            testbench: '10.12.0'
          - resolution: latest
            laravel: '^12.72'
            testbench: '^10.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, xml
          coverage: xdebug
          github-token: ${{ github.token }}
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve package-local dependencies
        run: >-
          composer update
          --with "laravel/framework:${{ matrix.laravel }}"
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --prefer-stable --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - name: Record resolved dependencies
        run: |
          mkdir -p build
          composer show --locked --format=json > build/dependencies.json
      - name: Backend tests
        run: composer test -- --coverage-clover=build/coverage.xml
      - name: Retain dependency and quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-${{ matrix.resolution }}-${{ github.sha }}
          path: |
            composer.lock
            build/dependencies.json
            build/coverage.xml
