# Purpose: Execute the package-local Pest suite in CI against the supported Laravel and Testbench matrix
# and verify the bc-shop shared-types browser canary against a Workbench app.

name: run-tests

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ${{ matrix.os }}

    env:
      # set the width of the docker containers terminal to prevent truncation of test output.
      COLUMNS: 150

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.3]
        laravel: [11.*]
        include:
          - laravel: 11.*
            testbench: 9.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-interaction \
            --no-update

          composer update \
            --prefer-stable \
            --prefer-dist \
            --no-interaction \
            --no-progress
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Publish config files
        run: vendor/bin/testbench vendor:publish --tag=config

      - name: Execute tests
        run: vendor/bin/pest --testsuite=Package --parallel --no-coverage
